<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Chewy&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <title>Formular | Eventnavn</title>
  <link rel="stylesheet" href="./starter.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="site-header">
    <div class="header-content">
      <a class="site-logo" href="index.html">
        <img class="logo-billede" src="./img/Aktiv8.webp" alt="">
        <span>Sanse Hytten</span>
      </a>
      <nav class="site-nav">
        <button popovertarget="menu">Menu</button>
        <ul class="menu" id="menu" popover>
          <li><a href="./">Forside</a></li>
          <li><a href="./svg.html">Elementer</a></li>
          <li><a href="./form.html" aria-current="page">Tilmelding</a></li>
          <li><a href="./404.html">Kontakt</a></li>
        </ul>

      </nav>
    </div>
  </header>

  <main>
    <section class="form-page">
      <header class="form-intro">

        <div class="heleliste">
          <h1 class="dinhuskeliste">Din huskeliste </h1>
          <p class="huskep">Ting du skal huske når du skal i Sanse hytten </p>

          <ol class="huskeliste">

            <li>

              <div class="huskeliste-div"> • Badetøj</div>
            </li>

            <li>

              <div class="huskeliste-div"> • Håndklæde</div>
            </li>

            <li>

              <div class="huskeliste-div"> • Drikkedunk</div>
            </li>


            <li>

              <div class="huskeliste-div"> • Godt humør</div>
            </li>




          </ol>



        </div>
      </header>

      <form class="form-placeholder" action="./opsamling.html" method="get">

        <fieldset>

          <h2 class="h2form">Tilmeld dig her </h2>

          <div>
            <label> Fulde navn </label>
            <input type="text" id="navn" name="navn" required>
          </div>

          <div>
            <label> Email</label>
            <input type="Email" id="mail" name="mail" required>
          </div>

          <div>
            <label> Telefonnummer</label>
            <input tyoe="tel" id="nummer" name="nummer" required>
          </div>


          <fieldset>
            <legend>Hvilket hold vil du tilmelde dig?</legend>
            <label class="nat"> 11.12.2026 - by night
              <input type="radio" name="hold" value="night">
            </label>

            <label class="dag"> 12.12.2026 - by day
              <input type="radio" name="hold" value="day">
            </label>
          </fieldset>


          <div>
            <label> Vælg dine fortrukende element</label>
            <select id="valg" name="behandling" required>
              <option value="">Vælg her</option>
              <option value="Vand">Vand</option>
              <option value="Jord">Jord</option>
              <option value="Ild">Ild</option>
              <option value="Luft">Luft</option>
            </select>
          </div>

          <label class="slutning"> Jeg accepterer Sauna hyttens retnings linjer
            <input type="checkbox" required>
          </label> <button type="submit"> Tilmeld nu </button>



        </fieldset>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p>@2026 Sanse Hytten</p>
      <p>Af Livia & Filippa</p>
    </div>
  </footer>
  <script src="./script.js"></script>
</body>

</html>
